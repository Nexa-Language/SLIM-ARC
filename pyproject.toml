[project]
name = "slim-arc-tools"
version = "1.1.0"
description = "Experiment, integration, and reporting tools for SLIM-ARC"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "reports/Competition_Report_Finals"]

[tool.ruff]
line-length = 160
target-version = "py310"
